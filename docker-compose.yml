# Orquestación completa: SQL Server + script inicial + API .NET + Web React
# Uso: docker compose up --build

services:

  # 1) Motor de base de datos
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lockton-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Lockton_Dev_2026!}
    ports:
      - "14333:1433"   
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # 2) Ejecuta database/init.sql una vez que SQL Server está listo, y termina
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lockton-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/init.sql:/init.sql:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - db
      - -U
      - sa
      - -P
      - ${SA_PASSWORD:-Lockton_Dev_2026!}
      - -C
      - -b
      - -i
      - /init.sql
    restart: "no"

  # 3) API REST .NET 8
  api:
    build: ./backend
    container_name: lockton-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=LocktonDb;User Id=sa;Password=${SA_PASSWORD:-Lockton_Dev_2026!};TrustServerCertificate=True"
      Jwt__Clave: ${JWT_KEY:-SOLO-DESARROLLO-clave-local-de-pruebas-cambiar-en-produccion-2026}
      Jwt__MinutosExpiracion: "60"
    ports:
      - "5000:8080"    # Swagger: http://localhost:5000/swagger

  # 4) Frontend React servido por nginx
  web:
    build: ./frontend
    container_name: lockton-web
    depends_on:
      - api
    ports:
      - "3000:80"      # App: http://localhost:3000

volumes:
  sqldata:
