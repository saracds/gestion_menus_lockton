server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas /api/* se reenvían al contenedor del backend (mismo origen → sin CORS)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: cualquier ruta (/usuarios, /modulo/polizas...) devuelve index.html y React Router decide
    location / {
        try_files $uri $uri/ /index.html;
    }
}
